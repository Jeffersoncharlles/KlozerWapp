services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    init: true
    environment:
      PORT: 3000
      DB_PATH: /data/crm.db
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set}
      MAX_USERS: ${MAX_USERS:-3}
      MAX_WHATSAPP: ${MAX_WHATSAPP:-1}
    volumes:
      - klozer_data:/data
    expose:
      - "3000"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000/health"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: /v1/api
    restart: unless-stopped
    init: true
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${WEB_PORT:-80}:80"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/health"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 5s

volumes:
  klozer_data:
